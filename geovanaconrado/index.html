<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#C9A84C;--gl:#F0D080;--gd:#8B6510;
  --black:#080808;--card:#111;--white:#F5F5F0;
  --dim:rgba(245,245,240,.55);
}
body{background:var(--black);color:var(--white);font-family:'Cormorant Garamond',serif;display:flex;justify-content:center;min-height:100vh}
.page{width:100%;max-width:460px;padding:44px 22px 90px;display:flex;flex-direction:column;align-items:center}
a{text-decoration:none;color:inherit}

/* Foto maior (180px) */
.avatar{width:180px;height:180px;border-radius:50%;border:3px solid var(--gold);overflow:hidden;box-shadow:0 0 40px rgba(201,168,76,.3)}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center top}

.person-name{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;font-style:italic;color:var(--white);margin-top:16px;letter-spacing:.5px}
.brand{font-family:'Cinzel',serif;font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;background:linear-gradient(180deg,var(--gl),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:8px}

.soc-icons{display:flex;gap:18px;margin-top:18px}
.soc-icon{width:34px;height:34px;border-radius:50%;border:1px solid rgba(201,168,76,.4);display:flex;align-items:center;justify-content:center;color:var(--gold);transition:border-color .2s,color .2s}
.soc-icon:hover{border-color:var(--gold);color:var(--gold)}
.soc-icon svg{width:15px;height:15px;fill:currentColor}

.div{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:28px auto}

/* HERO CARD - Ativação */
.hero-card{width:100%;margin-top:8px;background:linear-gradient(145deg,#1a1a1a,#0d0d0d);border:2px solid var(--gold);border-radius:24px;padding:32px 24px;position:relative;overflow:hidden;display:block;box-shadow:0 0 40px rgba(201,168,76,.18)}
.hero-card::after{content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.2),transparent 70%);pointer-events:none}
.hero-badge{display:inline-block;font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;background:var(--gold);color:#180f00;padding:5px 15px;border-radius:20px;margin-bottom:16px;font-weight:700}
.hero-icon{font-size:32px;margin-bottom:12px}
.hero-title{font-family:'Cinzel',serif;font-size:22px;font-weight:700;letter-spacing:1.5px;line-height:1.25;margin-bottom:16px;background:linear-gradient(180deg,var(--gl),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-hook{font-size:19px;font-weight:600;color:var(--white);line-height:1.4;margin-bottom:14px}
.hero-pain{font-size:15px;line-height:1.7;color:var(--dim);margin-bottom:18px}
.hero-desire{font-size:15.5px;line-height:1.75;color:rgba(245,245,240,.82);margin-bottom:14px}
.hero-desire strong{color:var(--gl);font-weight:600}
.hero-feel{font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic;color:var(--gold);margin-bottom:22px}

/* PREÇOS */
.price-box{border:1px solid rgba(201,168,76,.25);border-radius:14px;overflow:hidden;margin-bottom:22px}
.price-row{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;background:rgba(201,168,76,.05)}
.price-row+.price-row{border-top:1px solid rgba(201,168,76,.18)}
.price-label{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.price-val{font-family:'Cinzel',serif;font-size:20px;color:var(--gl);font-weight:700;text-align:right;}
.price-val small{font-family:'Cormorant Garamond',serif; font-size:14px;font-weight:400;color:var(--dim); letter-spacing:0; display:block; margin-top:2px;}

.hero-btn{display:block;width:100%;background:linear-gradient(135deg,var(--gl) 0%,var(--gold) 55%,var(--gd) 100%);color:#180f00;font-family:'Cinzel',serif;font-size:13px;font-weight:700;letter-spacing:1.5px;text-align:center;text-transform:uppercase;padding:18px;border-radius:14px;box-shadow:0 6px 26px rgba(201,168,76,.3)}

/* Depoimentos Imagens - Ajustados para ficarem menores */
.depo-label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin:8px 0 16px;text-align:center}
.depo-img {
  width: 80%; /* Deixa o depoimento menor */
  margin: 0 auto 15px auto;
  display: block;
  border-radius: 12px;
  border: 1px solid rgba(201,168,76,.2);
}

/* Lista de espera */
.links{width:100%;display:flex;flex-direction:column;gap:9px;margin-top:16px}
.link-row{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border:1px solid rgba(201,168,76,.16);border-radius:15px;transition:border-color .2s}
.link-row:hover{border-color:rgba(201,168,76,.4)}
.link-left{display:flex;flex-direction:column;gap:3px}
.link-name{font-size:15px;color:var(--white)}
.link-sub{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.link-tag{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(201,168,76,.3);border-radius:12px;padding:3px 9px;white-space:nowrap;margin-left:10px;flex-shrink:0}

.footer{margin-top:38px;text-align:center;font-size:12.5px;color:rgba(245,245,240,.4);line-height:2}
.footer strong{color:var(--gold);font-weight:500}
.footer a{color:var(--gold)}

.wa-float{position:fixed;bottom:24px;right:20px;z-index:200;width:54px;height:54px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,.4);transition:transform .2s}
.wa-float:hover{transform:scale(1.08)}
.wa-float svg{width:28px;height:28px;fill:white}
</style>
</head>
